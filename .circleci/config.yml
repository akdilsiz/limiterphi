version: 2.1
jobs:
  build:
    docker:
      - image: golang:1.25-alpine3.24
        environment:
          GO111MODULE: "on"

    working_directory: /go/src/github.com/akdilsiz/limiterphi
    steps:
      - checkout
      - run: sleep 10
      - run: go get -v -t ./...
      - run: sleep 5
      - run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...
      - run: bash <(curl -s https://codecov.io/bash)

